components:
  schemas:
    ListFirewallPoliciesRequest:
      type: object
      title: ListFirewallPoliciesRequest
      properties:
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: When you request a list of objects with a <code>MaxResults</code> setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Network Firewall returns a <code>NextToken</code> value in the response. To retrieve the next batch of objects, use the token returned from the prior request in your next request.
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/PaginationMaxResults'
          - description: The maximum number of objects that you want Network Firewall to return for this request. If more objects are available, in the response, Network Firewall provides a <code>NextToken</code> value that you can use in a subsequent call to get the next batch of objects.
    ListFirewallPoliciesResponse:
      type: object
      properties:
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: When you request a list of objects with a <code>MaxResults</code> setting, if the number of objects that are still available for retrieval exceeds the maximum you requested, Network Firewall returns a <code>NextToken</code> value in the response. To retrieve the next batch of objects, use the token returned from the prior request in your next request.
        FirewallPolicies:
          allOf:
          - $ref: '#/components/schemas/FirewallPolicies'
          - description: 'The metadata for the firewall policies. Depending on your setting for max results and the number of firewall policies that you have, this might not be the full list. '
    PaginationToken:
      type: string
      pattern: '[0-9A-Za-z:\/+=]+$'
      minLength: 1
      maxLength: 2048
    ResourceArn:
      type: string
      pattern: ^arn:aws.*
      minLength: 1
      maxLength: 256
    PaginationMaxResults:
      type: integer
      minimum: 1
      maximum: 100
    ThrottlingException: {}
    FirewallPolicies:
      type: array
      items:
        $ref: '#/components/schemas/FirewallPolicyMetadata'
    FirewallPolicyMetadata:
      type: object
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: The descriptive name of the firewall policy. You can't change the name of a firewall policy after you create it.
        Arn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: The Amazon Resource Name (ARN) of the firewall policy.
      description: 'High-level information about a firewall policy, returned by operations like create and describe. You can use the information provided in the metadata to retrieve and manage a firewall policy. You can retrieve all objects for a firewall policy by calling <a>DescribeFirewallPolicy</a>. '
    ResourceName:
      type: string
      pattern: ^[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    InvalidRequestException: {}
    InternalServerError: {}
