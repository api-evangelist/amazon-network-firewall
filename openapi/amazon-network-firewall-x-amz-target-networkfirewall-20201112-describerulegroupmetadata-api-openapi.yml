    DescribeRuleGroupMetadataRequest:
      type: object
      title: DescribeRuleGroupMetadataRequest
      properties:
        RuleGroupName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: <p>The descriptive name of the rule group. You can't change the name of a rule group after you create it.</p> <p>You must specify the ARN or the name, and you can specify both. </p>
        RuleGroupArn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: <p>The descriptive name of the rule group. You can't change the name of a rule group after you create it.</p> <p>You must specify the ARN or the name, and you can specify both. </p>
        Type:
          allOf:
          - $ref: '#/components/schemas/RuleGroupType'
          - description: <p>Indicates whether the rule group is stateless or stateful. If the rule group is stateless, it contains stateless rules. If it is stateful, it contains stateful rules. </p> <note> <p>This setting is required for requests that do not include the <code>RuleGroupARN</code>.</p> </note>
    Description:
      type: string
      pattern: ^.*$
      maxLength: 512
    ResourceName:
      type: string
      pattern: ^[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    InvalidRequestException: {}
    ResourceNotFoundException: {}
    RuleCapacity:
      type: integer
    StatefulRuleOptions:
      type: object
      properties:
        RuleOrder:
          allOf:
          - $ref: '#/components/schemas/RuleOrder'
          - description: 'Indicates how to manage the order of the rule evaluation for the rule group. <code>DEFAULT_ACTION_ORDER</code> is the default behavior. Stateful rules are provided to the rule engine as Suricata compatible strings, and Suricata evaluates them based on certain settings. For more information, see <a href="https://docs.aws.amazon.com/network-firewall/latest/developerguide/suricata-rule-evaluation-order.html">Evaluation order for stateful rules</a> in the <i>Network Firewall Developer Guide</i>. '
      description: Additional options governing how Network Firewall handles the rule group. You can only use these for stateful rule groups.
    RuleOrder:
      type: string
      enum:
      - DEFAULT_ACTION_ORDER
      - STRICT_ORDER
    DescribeRuleGroupMetadataResponse:
      type: object
      required:
      - RuleGroupArn
      - RuleGroupName
      properties:
        RuleGroupArn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: <p>The descriptive name of the rule group. You can't change the name of a rule group after you create it.</p> <p>You must specify the ARN or the name, and you can specify both. </p>
        RuleGroupName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: <p>The descriptive name of the rule group. You can't change the name of a rule group after you create it.</p> <p>You must specify the ARN or the name, and you can specify both. </p>
        Description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: 'Returns the metadata objects for the specified rule group. '
        Type:
          allOf:
          - $ref: '#/components/schemas/RuleGroupType'
          - description: <p>Indicates whether the rule group is stateless or stateful. If the rule group is stateless, it contains stateless rules. If it is stateful, it contains stateful rules. </p> <note> <p>This setting is required for requests that do not include the <code>RuleGroupARN</code>.</p> </note>
        Capacity:
          allOf:
          - $ref: '#/components/schemas/RuleCapacity'
          - description: <p>The maximum operating resources that this rule group can use. Rule group capacity is fixed at creation. When you update a rule group, you are limited to this capacity. When you reference a rule group from a firewall policy, Network Firewall reserves this capacity for the rule group. </p> <p>You can retrieve the capacity that would be required for a rule group before you create the rule group by calling <a>CreateRuleGroup</a> with <code>DryRun</code> set to <code>TRUE</code>. </p>
        StatefulRuleOptions:
          $ref: '#/components/schemas/StatefulRuleOptions'
        LastModifiedTime:
