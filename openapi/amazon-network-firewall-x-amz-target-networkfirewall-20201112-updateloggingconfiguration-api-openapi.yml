tags:
- name: '#X Amz Target=NetworkFirewall 20201112.UpdateLoggingConfiguration'
paths:
  /#X-Amz-Target=NetworkFirewall_20201112.UpdateLoggingConfiguration:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateLoggingConfiguration
      description: 'Sets the logging configuration for the specified firewall.


        To change the logging configuration, retrieve the LoggingConfiguration by calling DescribeLoggingConfiguration, then change it and provide the modified object to this update call. You must change the logging configuration one LogDestinationConfig at a time inside the retrieved LoggingConfiguration object.


        You can perform only one of the following actions in any call to UpdateLoggingConfiguration:


        Create a new log destination object by adding a single LogDestinationConfig array element to LogDestinationConfigs.


        Delete a log destination object by removing a single LogDestinationConfig array element from LogDestinationConfigs.


        Change the LogDestination setting in a single LogDestinationConfig array element.


        You can''t change the LogDestinationType or LogType in a LogDestinationConfig. To change these settings, delete the existing LogDestinationConfig object and create a new one, using two separate calls to this update operation.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLoggingConfigurationResponse'
              examples:
                UpdateLoggingConfiguration200Example:
                  summary: Default UpdateLoggingConfiguration 200 response
                  x-microcks-default: true
                  value:
                    FirewallArn: arn:aws:service:us-east-1:123456789012:resource/example
                    FirewallName: my-resource
                    LoggingConfiguration: example-ref
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '484':
          description: InvalidTokenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidTokenException'
        '485':
          description: LogDestinationPermissionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogDestinationPermissionException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoggingConfigurationRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - NetworkFirewall_20201112.UpdateLoggingConfiguration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      summary: Amazon Network Firewall Update Logging Configuration
      tags:
      - '#X Amz Target=NetworkFirewall 20201112.UpdateLoggingConfiguration'
components:
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    ThrottlingException: {}
    LogDestinationConfig:
      type: object
      required:
      - LogType
      - LogDestinationType
      - LogDestination
      properties:
        LogType:
          allOf:
          - $ref: '#/components/schemas/LogType'
          - description: 'The type of log to send. Alert logs report traffic that matches a <a>StatefulRule</a> with an action setting that sends an alert log message. Flow logs are standard network traffic flow logs. '
        LogDestinationType:
          allOf:
          - $ref: '#/components/schemas/LogDestinationType'
          - description: The type of storage destination to send these logs to. You can send logs to an Amazon S3 bucket, a CloudWatch log group, or a Kinesis Data Firehose delivery stream.
        LogDestination:
          allOf:
          - $ref: '#/components/schemas/LogDestinationMap'
          - description: '<p>The named location for the logs, provided in a key:value mapping that is specific to the chosen destination type. </p> <ul> <li> <p>For an Amazon S3 bucket, provide the name of the bucket, with key <code>bucketName</code>, and optionally provide a prefix, with key <code>prefix</code>. The following example specifies an Amazon S3 bucket named <code>DOC-EXAMPLE-BUCKET</code> and the prefix <code>alerts</code>: </p> <p> <code>"LogDestination": { "bucketName": "DOC-EXAMPLE-BUCKET", "prefix": "alerts" }</code> </p> </li> <li> <p>For a CloudWatch log group, provide the name of the CloudWatch log group, with key <code>logGroup</code>. The following example specifies a log group named <code>alert-log-group</code>: </p> <p> <code>"LogDestination": { "logGroup": "alert-log-group" }</code> </p> </li> <li> <p>For a Kinesis Data Firehose delivery stream, provide the name of the delivery stream, with key <code>deliveryStream</code>. The following example specifies a delivery stream named <code>alert-delivery-stream</code>: </p> <p> <code>"LogDestination": { "deliveryStream": "alert-delivery-stream" }</code> </p> </li> </ul>'
      description: <p>Defines where Network Firewall sends logs for the firewall for one log type. This is used in <a>LoggingConfiguration</a>. You can send each type of log to an Amazon S3 bucket, a CloudWatch log group, or a Kinesis Data Firehose delivery stream.</p> <p>Network Firewall generates logs for stateful rule groups. You can save alert and flow log types. The stateful rules engine records flow logs for all network traffic that it receives. It records alert logs for traffic that matches stateful rules that have the rule action set to <code>DROP</code> or <code>ALERT</code>. </p>
    InternalServerError: {}
    ResourceArn:
      type: string
      pattern: ^arn:aws.*
      minLength: 1
      maxLength: 256
    UpdateLoggingConfigurationRequest:
      type: object
      title: UpdateLoggingConfigurationRequest
      properties:
        FirewallArn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: <p>The Amazon Resource Name (ARN) of the firewall.</p> <p>You must specify the ARN or the name, and you can specify both. </p>
        FirewallName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: <p>The descriptive name of the firewall. You can't change the name of a firewall after you create it.</p> <p>You must specify the ARN or the name, and you can specify both. </p>
        LoggingConfiguration:
          allOf:
          - $ref: '#/components/schemas/LoggingConfiguration'
          - description: Defines how Network Firewall performs logging for a firewall. If you omit this setting, Network Firewall disables logging for the firewall.
    ResourceName:
      type: string
      pattern: ^[a-zA-Z0-9-]+$
      minLength: 1
      maxLength: 128
    LogDestinationMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/HashMapValue'
    LogDestinationType:
      type: string
      enum:
      - S3
      - CloudWatchLogs
      - KinesisDataFirehose
      pattern: '[0-9A-Za-z]+'
      minLength: 2
      maxLength: 30
    InvalidRequestException: {}
    ResourceNotFoundException: {}
    LogDestinationPermissionException: {}
    LoggingConfiguration:
      type: object
      required:
      - LogDestinationConfigs
      properties:
        LogDestinationConfigs:
          allOf:
          - $ref: '#/components/schemas/LogDestinationConfigs'
          - description: 'Defines the logging destinations for the logs for a firewall. Network Firewall generates logs for stateful rule groups. '
      description: 'Defines how Network Firewall performs logging for a <a>Firewall</a>. '
    InvalidTokenException: {}
    LogDestinationConfigs:
      type: array
      items:
        $ref: '#/components/schemas/LogDestinationConfig'
    UpdateLoggingConfigurationResponse:
      type: object
      properties:
        FirewallArn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: The Amazon Resource Name (ARN) of the firewall.
        FirewallName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          - description: The descriptive name of the firewall. You can't change the name of a firewall after you create it.
        LoggingConfiguration:
          $ref: '#/components/schemas/LoggingConfiguration'
    LogType:
      type: string
      enum:
      - ALERT
      - FLOW
    HashMapValue:
      type: string
      pattern: '[\s\S]*$'
      minLength: 1
      maxLength: 1024
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
